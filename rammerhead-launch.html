<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Opening page | CORE_SEARCH</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #050807; color: #b7ffc9; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    main { max-width: 34rem; padding: 2rem; text-align: center; }
    h1 { color: #61f99b; }
    footer { position: fixed; right: 0; bottom: 0; left: 0; padding: 0.5rem; border-top: 1px solid #183323; color: #8fa99a; font-size: 0.7rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>CORE_SEARCH</h1>
    <p id="status" role="status" aria-live="polite">Starting your full-page browser...</p>
  </main>
  <footer>CORE_SEARCH v1.3.2 | NOVEMBER 1, 2026 | RUN BY THE SHADOW NETWORK</footer>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const destination = new URL(new URL(location.href).searchParams.get('url'));
        if (!['http:', 'https:'].includes(destination.protocol)) {
          throw new Error('Only HTTP and HTTPS websites can be opened.');
        }
        status.textContent = `Opening ${destination.hostname}...`;
        const response = await fetch('/newsession', { cache: 'no-store' });
        if (!response.ok) throw new Error(`The browser service returned HTTP ${response.status}.`);
        const sessionId = (await response.text()).trim();
        if (!/^[a-z0-9]{32}$/i.test(sessionId)) {
          throw new Error('The browser service returned an invalid session.');
        }
        location.replace(`/${sessionId}/${destination.href}`);
      } catch (error) {
        status.textContent = `Could not open this page: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
